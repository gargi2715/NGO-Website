
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer | HopeHands</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h2>HopeHands Foundation 💚</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="causes.html">Causes</a>
        <a href="volunteer.html">Volunteer</a>
        <a href="donate.html">Donate</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="page-title">
    <h1>Become A Volunteer</h1>
    <p>Be a part of something meaningful.</p>
</section>

<section class="container volunteer-section">

    <div class="volunteer-image">
        <img src="https://images.unsplash.com/photo-1559027615-cd4628902d4a?w=800"
             alt="Volunteers working together">
        <h2>Be The Change You Want To See</h2>
        <p>Your time and kindness can make a real difference.</p>
    </div>

    <form id="volunteerForm">

        <h2>Volunteer Registration</h2>

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="Enter 10-digit phone number" required>

        <label>Area of Interest</label>
        <select id="interest" required>
            <option value="">Select an option</option>
            <option>Education</option>
            <option>Food Distribution</option>
            <option>Healthcare</option>
            <option>Environment</option>
        </select>

        <button type="submit" class="btn">Submit Application</button>

        <p id="formMessage"></p>

    </form>

</section>

<footer>
    <p>© 2026 HopeHands Foundation</p>
</footer>

</body>
</html>
